# Strict baseline from the lint-and-style-config skill. The include is pinned
# to the version-numbered file: verify it exists after any very_good_analysis
# bump (ls ~/.pub-cache/hosted/pub.dev/very_good_analysis-*/lib/).
include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/l10n/generated/**"
    - "build/**"
    - "android/**"
    - "ios/**"

  errors:
    # Dropped Futures
    unawaited_futures: error
    discarded_futures: error
    # Swallowed failure
    empty_catches: error
    avoid_catches_without_on_clauses: error
    only_throw_errors: error
    throw_in_finally: error
    # Dead context after await
    use_build_context_synchronously: error
    # Resource leaks
    cancel_subscriptions: error
    close_sinks: error
    # Type holes
    avoid_dynamic_calls: error
    always_declare_return_types: error
    cast_nullable_to_non_nullable: error
    # Exhaustiveness
    exhaustive_cases: error
    # Shipping hygiene
    avoid_print: error
    avoid_slow_async_io: error
    # Public-API docs: Fasomo is an app with no external consumers, so this is
    # downgraded per the rule catalog. Seams (repositories, services, the
    # notification engine, pure calendar logic) are still documented by hand.
    public_member_api_docs: ignore
    dangling_library_doc_comments: error
    # Deliberately not errors
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning
    lines_longer_than_80_chars: ignore

formatter:
  trailing_commas: preserve
