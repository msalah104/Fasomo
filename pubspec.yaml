name: fasomo
description: A Muslim fasting tracker app with Hijri calendar support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Hijri Calendar
  hijri: ^3.0.0
  shamsi_date: ^1.0.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Local Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

  # Localization
  intl: ^0.18.1

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Dependency Injection
  get_it: ^7.6.4

  # Date utilities
  jiffy: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Amiri
  #     fonts:
  #       - asset: fonts/Amiri-Regular.ttf
