name: fasomo
description: A Muslim fasting tracker app with Hijri calendar support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  bloc_concurrency: ^0.3.0
  clock: ^1.1.3
  crypto: ^3.0.8
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  file_picker: ^13.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  geolocator: ^14.0.1
  get_it: ^9.3.0
  hijri: ^3.0.1
  home_widget: ^0.10.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Licence texts for the bundled fonts, shown on the licence page.
    - assets/fonts/el_messiri/OFL.txt
    - assets/fonts/ibm_plex_sans_arabic/OFL.txt
  # Family names must match the tokens in lib/core/theme/app_fonts.dart.
  # El Messiri's statics are instanced from the upstream variable font.
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/el_messiri/ElMessiri-Regular.ttf
        - asset: assets/fonts/el_messiri/ElMessiri-Medium.ttf
          weight: 500
        - asset: assets/fonts/el_messiri/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/el_messiri/ElMessiri-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

# Launcher icons, generated with `dart run flutter_launcher_icons` from the
# sources in design/art/app_icon.svg (rendered into assets/icon/).
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1E2A4A"
  adaptive_icon_foreground: assets/icon/app_icon.png
