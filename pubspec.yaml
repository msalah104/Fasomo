name: fasomo
description: A Muslim fasting tracker app with Hijri calendar support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  bloc_concurrency: ^0.3.0
  clock: ^1.1.3
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  get_it: ^9.3.0
  hijri: ^3.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
