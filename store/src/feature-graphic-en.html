<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Play feature graphic, 1024x500. Render with:
     store/src/render.sh store/src/feature-graphic-en.html store/android/en/feature-graphic.png 1024 500 -->
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #0B1022; }
  .sky { position: absolute; left: 0; top: -95px; width: 1024px; transform: scaleX(-1); }
  /* Fades the dotted arc where it passes behind the text. */
  .veil { position: absolute; inset: 0 0 110px 0;
          background: linear-gradient(90deg, rgba(11,16,34,.92) 0%, rgba(11,16,34,.75) 45%, rgba(11,16,34,0) 66%); }
  .text { position: absolute; left: 72px; top: 92px; color: #F6F2E9;
          font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 124px; height: 124px; margin: -18px -12px -18px -22px; }
  h1 { margin: 0; font-size: 76px; font-weight: 700; letter-spacing: -1px; }
  p { margin: 18px 0 0; font-size: 31px; line-height: 1.3; font-weight: 500; color: #E7E0CF; }
  p b { color: #E6B85C; font-weight: 600; }
</style></head>
<body>
  <img class="sky" src="../../design/art/sky_night.svg" alt="">
  <div class="veil"></div>
  <div class="text">
    <div class="brand"><img src="../../design/art/logo_mark_gold.svg" alt=""><h1>Fasomo</h1></div>
    <p>Never miss a <b>Sunnah fast</b>.<br>Hijri calendar, reminders and Qada.</p>
  </div>
</body></html>
